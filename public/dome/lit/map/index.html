e arms of unbelievable space.\" — Moser & MacLeod, PDF p.320 immersive environments, actual and virtual", "in": ["the-corpus-argues-with-itself", "body-as-instrument", "hidden-apparatus", "lecture-as-form", "public-room", "bay-cheng-mapping-intermediality", "bishop-artificial-hells", "de-certeau-practice-of-everyday-life", "debord-society-of-the-spectacle", "fischer-lichte-culture-as-performance", "moser-macleod-immersed-in-technology", "remann-francis-fulldome-manifesto", "saper-tomlinson-fulldome-modalities"], "rank": 2}, {"id": "body-as-instrument", "path": "concepts/body-as-instrument.md", "title": "The body is the instrument, and immersion tests it", "type": "concept", "kind": "", "tags": ["embodiment", "perception", "intercorporeality"], "confidence": "medium", "contested": false, "created": "2026-09-23", "updated": "2026-09-23", "out": [{"t": "merleau-ponty-phenomenology-of-perception", "section": "Sources cited", "label": ""}, {"t": "fuchs-intercorporeality", "section": "Sources cited", "label": ""}, {"t": "gallese-roots-of-empathy", "section": "Sources cited", "label": ""}, {"t": "moser-macleod-immersed-in-technology", "section": "Sources cited", "label": ""}, {"t": "hayles-how-we-became-posthuman", "section": "Sources cited", "label": ""}, {"t": "remann-francis-fulldome-manifesto", "section": "Sources cited", "label": ""}, {"t": "yu-future-directions", "section": "Sources cited", "label": ""}, {"t": "frame", "section": "See also", "label": ""}, {"t": "audience", "section": "See also", "label": ""}, {"t": "public-room", "section": "See also", "label": ""}], "cited": {}, "quotes": [["The body is our general medium for having a world.", "Merleau-Ponty, PDF p.194"], ["What counts for the orientation of the spectacle is not my body as it in fact is, as a thing in objective space, but as a system of possible actions, a virtual body with its phenomenal 'place' defined by its task and situation. My body is wherever there is something to be done.\" / \"This virtual body ousts the real one to such an extent that the subject no longer has the feeling of being in the world where he actually is, and that instead of his real legs and arms, he feels that he has the legs and arms he would need to walk and act in the reflected room: he inhabits the spectacle.", "Merleau-Ponty, PDF p.316"], ["Our body schemas and feelings expand and 'incorporate' the perceived body of the other.", "Fuchs, PDF p.5"], ["We do not need to form internal models or representations of others in order to understand and communicate with them; as bodily subjects, we are always already involved in a shared affective and expressive space.", "Fuchs, PDF p.12"], ["According to this perspective, to perceive an action is equivalent to internally simulate it.", "Gallese, PDF p.4"], ["As my perception accommodates itself to the three-dimensional illusion, I accrue a sense of being in another, additional skin; I feel immersed. Yet as I experience immersion in the simulation, I simultaneously lose the sense of being grounded in physical space, I experience the sensation of disembodiment.", "Moser & MacLeod, PDF p.301"], ["In these systems, the user learns, kinesthetically and proprioceptively, that the relevant boundaries for interaction are defined less by the skin than by the feedback loops connecting body and simulation in a technobio-integrated circuit.", "Hayles, PDF p.42"], ["Just because information has lost its body does not mean that humans and the world have lost theirs.", "Hayles, PDF p.259"]], "words": 575, "body_head": "Merleau-Ponty is the source of the claim the dome needs, and his description of the virtual body displacing the real one is the single most directly usable sentence in the corpus for a dome argument: thing in objective space, but as a system of possible actions, a virtual body with its phenomenal 'place' defined by its task and situation. My body is wherever there is something to be done.\" / \"This virtual body", "in": ["frame", "knowledge-m en vision and viewer: the frame age!", "Remann & Francis, PDF p.4"], ["Like the frame of the architectural window and the frame of the painting, the frame of the moving-image screen marks a separation—an 'ontological cut'—between the material surface of the wall and the view contained within its aperture.", "Friedberg, PDF p.20"], ["These plans—whether with multiple mobile projectors and a spectator encircled by the screen, or a theater with walls, ceiling, and an adjustable main screen as projection surfaces—were designed to abolish the proscenium frame and allow the spectator to be lost in the imaginary space of the screen: not in distraction but immersion.", "Friedberg, PDF p.185"], ["The history of the theater is the history of the transfiguration of the human form. […] The materials involved in this transfiguration are form and color, the materials of the painter and sculptor. The arena for this transfiguration is found in the constructive fusion of space and building, the realm of the architect. Through the manipulation of these materials the role of the artist, the synthesizer of these elements, is determined.", "Schlemmer, PDF p.4 / printed p.17"], ["This confrontation of passive spectator and animate actor preconditions also the form of the stage, at its most monumental as the antique arena and at its most primitive as the scaffold in the market place. The need for concentration resulted in the peep show or 'picture frame,' today the 'universal' form of the stage.", "Schlemmer, PDF p.5 / printed p.18"]], "words": 1167, "body_head": "The dome's own literature treats the rectangle as a historical restriction of vision, and the art-history literature supplies the same claim with the evidence. Grau's account of the panorama is the strong form: the image space stops being something you look at and becomes something you are inside, and the presentation apparatus shuts the rest of the world out. or at least fills the observer's entire field of vision", "in": ["the /* ---------- state ---------- */
const TYPES = Object.keys(DATA.counts.by_type).sort();
const state = {
  view: 'graph',
  types: new Set(TYPES),
  tags: new Set(),
  q: '',
  asOf: null,
  step: null,
  mode: 'date',
  sel: null,
  zoom: 1, panX: 0, panY: 0
};

const byId = {};
DATA.nodes.forEach(n => byId[n.id] = n);

/* ---------- predicates ---------- */
function dateOf(n){ return n.created || '9999-99-99'; }
function visible(n){
  if (!state.types.has(n.type)) return false;
  if (state.asOf && dateOf(n) > state.asOf) return false;
  if (state.step != null){
    const k = (DATA.spine || []).indexOf(n.id);
    if (k < 0 || k > state.step) return false;
  }
  if (state.tags.size && !n.tags.some(t => state.tags.has(t))) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [n.title, n.id, n.type, n.kind, n.confidence,
                 (n.tags||[]).join(' '), n.body_head,
                 (n.quotes||[]).map(x => x[0]).join(' ')].join(' ').toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function visIds(){ return new Set(DATA.nodes.filter(visible).map(n => n.id)); }

/* ---------- header ---------- */
function headStat(){
  const vis = DATA.nodes.filter(visible).length;
  const es = DATA.edges.filter(e => visible(byId[e.s]) && visible(byId[e.t])).length;
  const q = DATA.nodes.filter(visible).reduce((a,n) => a + (n.quotes||[]).length, 0);
  const rows = [
    ['pages', vis + ' / ' + DATA.counts.pages],
    ['links', DATA.counts.links],
    ['quotes', q],
    ['words', (DATA.counts.words/1000).toFixed(0) + 'k'],
    ['edges', es]
  ];
  document.getElementById('head-stat').innerHTML =
    rows.map(r => `<div><b>${r[1]}</b><span>${r[0]}</span></div>`).join('');
}

/* ---------- filters ui ---------- */
function buildTypes(){
  document.getElementById('types').innerHTML = TYPES.map(t =>
    `<button class="on" data-type="${t}">${t}</button>`).join('');
  document.getElementById('types').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    const t = b.dataset.type;
    state.types.has(t) ? state.types.delete(t) : state.types.add(t);
    b.classList.toggle('on'); render();
  };
}
function buildTags(){
  document.getElementById('tags').innerHTML = DATA.tags.map(t =>
    `<button data-tag="${t}">${t}</button>`).join('');
  document.getElementById('tags').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    const t = b.dataset.tag;
    state.tags.has(t) ? state.tags.delete(t) : state.tags.add(t);
    b.classList.toggle('on'); render();
  };
}
function buildGrowth(){
  const dates = [...new Set(DATA.nodes.map(dateOf).filter(d => d && d < '9999'))].sort();
  const spine = DATA.spine || [];
  /* one date for the whole wiki so far means a date slider says nothing: step through the
     reading order instead, so the slider shows the review assembling itself. */
  state.mode = dates.length >= 3 ? 'date' : 'spine';
  const n = state.mode === 'date' ? dates.length : spine.length;
  const el = document.getElementById('asof');
  el.min = 0; el.max = Math.max(n - 1, 0); el.value = el.max;
  const lbl = document.getElementById('asof-v');
  const paint = () => {
    if (state.mode === 'date') { lbl.textContent = 'as of ' + (state.asOf || 'now'); }
    else if (state.step == null) { lbl.textContent = 'all ' + spine.length + ' pages'; }
    else { lbl.textContent = 'spine ' + (state.step + 1) + ' / ' + spine.length; }
  };
  el.oninput = () => {
    const i = +el.value;
    if (state.mode === 'date') {
      state.step = null;
      state.asOf = (i >= dates.length - 1) ? null : dates[i];
    } else {
      state.asOf = null;
      state.step = (i >= spine.length - 1) ? null : i;
    }
    paint(); render();
  };
  paint();
}
function buildRecent(){
  const rs = [...DATA.nodes].sort((a,b) => (b.updated||'').localeCompare(a.updated||''))
    .slice(0, 12);
  document.getElementById('recent').innerHTML =
    '<b>recent</b>' + rs.map(n =>
      `<a href="#" data-go="${n.id}">${n.updated||n.created} ${n.id}</a>`).join('');
  document.getElementById('recent').onclick = e => {
    const a = e.target.closest('a'); if (!a) return;
    e.preventDefault(); select(a.dataset.go);
  };
}
document.getElementById('q').oninput = e => { state.q = e.target.value; render(); };
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement.id !== 'q'){
    e.preventDefault(); document.getElementById('q').focus();
  }
});
document.getElementById('reload').onclick = e => { e.preventDefault(); location.reload(); };

/* ---------- views ---------- */
function setView(v){
  state.view = v;
  ['graph','matrix','index'].forEach(x => {
    document.getElementById('v-' + x).classList.toggle('on', x === v);
    const n = document.getElementById(x);
    if (n) n.hidden = (x !== v);
  });
  document.getElementById('svg').style.visibility = (v === 'graph') ? 'visible' : 'hidden';
  render();
}
document.getElementById('v-graph').onclick = () => setView('graph');
document.getElementById('v-matrix').onclick = () => setView('matrix');
document.getElementById('v-index').onclick = () => setView('index');
document.getElementById('v-fit').onclick = () => { setView('graph'); fitView(); renderGraph(); };
document.getElementById('v-reset').onclick = () => { location.reload(); };

/* ---------- graph ---------- */
const NW = 172;                       // node box width
const PAD = 6, LH = 12;
function lines(n){
  const L = [];
  L.push(n.type.toUpperCase() + (n.kind ? ' · ' + n.kind : ''));
  if (n.tags && n.tags.length) L.push(n.tags.slice(0,3).join(' '));
  L.push('out ' + n.out.length + '   in ' + n.in.length);
  if (n.confidence) L.push('conf ' + n.confidence + (n.contested ? '  contested' : ''));
  if (n.quotes && n.quotes.length) L.push(n.quotes.length + ' quotes');
  return L;
}
function nodeH(n){ return 20 + lines(n).length * LH + 6; }
function short(s, k){ return s.length > k ? s.slice(0, k - 1) + '…' : s; }
function titleLines(n){
  const t = n.title.toUpperCase();
  const words = t.split(' ');
  const out = []; let cur = '';
  words.forEach(w => {
    if ((cur + ' ' + w).trim().length > 24){ out.push(cur.trim()); cur = w; }
    else cur += ' ' + w;
  });
  if (cur.trim()) out.push(cur.trim());
  return out.slice(0, 3);
}

const N = {};                          // id -> layout box
let pendingFit = true;
(function layout(){
  const concepts = DATA.nodes.filter(n => n.type === 'concept').sort((a,b) => a.rank - b.rank);
  const others = DATA.nodes.filter(n => n.type !== 'concept');

  // 1. concepts on a vertical spine, in schema order
  concepts.forEach((c, i) => {
    N[c.id] = { id: c.id, x: 0, y: (i - (concepts.length - 1) / 2) * 340,
                vx: 0, vy: 0, w: NW, h: nodeH(c) };
  });

  // 2. each other page starts near the concept it links to most, fanned out
  const wgt = {};
  DATA.edges.forEach(e => {
    (wgt[e.s] = wgt[e.s] || {})[e.t] = ((wgt[e.s] || {})[e.t] || 0) + 1;
  });
  others.forEach((n, i) => {
    let best = null, bw = 0;
    const w = wgt[n.id] || {};
    for (const k in w) if (N[k] && w[k] > bw){ bw = w[k]; best = k; }
    const base = best ? N[best] : { x: 0, y: 0 };
    const a = i * 2.399;
    const r = 300 + (i % 4) * 70;
    N[n.id] = { id: n.id, x: base.x + Math.cos(a) * r, y: base.y + Math.sin(a) * r,
                vx: 0, vy: 0, w: NW, h: nodeH(n) };
  });

  const boxes = Object.values(N);
  const anchor = {};
  boxes.forEach(b => anchor[b.id] = { x: b.x, y: b.y });
  const isConcept = id => concepts.some(c => c.id === id);

  for (let it = 0; it < 700; it++){
    const k = 1 - it / 900;
    // 3a. separate overlapping boxes, full resolution
    for (let i = 0; i < boxes.length; i++){
      for (let j = i + 1; j < boxes.length; j++){
        const a = boxes[i], b = boxes[j];
        const px = (a.w + b.w) / 2 + 34, py = (a.h + b.h) / 2 + 26;
        const dx = b.x - a.x, dy = b.y - a.y;
        if (Math.abs(dx) >= px || Math.abs(dy) >= py) continue;
        const ox = px - Math.abs(dx), oy = py - Math.abs(dy);
        const af = isConcept(a.id) ? 0.15 : 1, bf = isConcept(b.id) ? 0.15 : 1;
        if (ox / px < oy / py){
          const s = (dx < 0 ? -1 : 1) * ox * 0.52;
          a.x -= s * af; b.x += s * bf;
        } else {
          const s = (dy < 0 ? -1 : 1) * oy * 0.52;
          a.y -= s * af; b.y += s * bf;
        }
      }
    }
    // 3b. springs
    DATA.edges.forEach(e => {
      const a = N[e.s], b = N[e.t]; if (!a || !b) return;
      let dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.max(Math.hypot(dx, dy), 1);
      const pull = ((d - 320) / d) * 0.03 * k;
      const ox = dx * pull, oy = dy * pull;
      if (!isConcept(a.id)){ a.x += ox; a.y += oy; }
      if (!isConcept(b.id)){ b.x -= ox; b.y -= oy; }
    });
    // 3c. anchors
    boxes.forEach(b => {
      const an = anchor[b.id], w = isConcept(b.id) ? 0.35 : 0.004;
      b.x += (an.x - b.x) * w * k;
      b.y += (an.y - b.y) * w * k;
    });
  }
  // 4. put concept boxes back exactly on the spine
  concepts.forEach(c => { N[c.id].x = 0; });
})();

function fitView(){
  const boxes = Object.values(N);
  if (!boxes.length) return;
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  boxes.forEach(b => {
    x0 = Math.min(x0, b.x - b.w / 2); x1 = Math.max(x1, b.x + b.w / 2);
    y0 = Math.min(y0, b.y - b.h / 2); y1 = Math.max(y1, b.y + b.h / 2);
  });
  const svg = document.getElementById('svg');
  const W = Math.max(svg.clientWidth, 320), H = Math.max(svg.clientHeight, 240);
  // fit the width (the spine is tall; pan vertically rather than shrink to nothing)
  const z = Math.min(W / (x1 - x0 + 60), 1.25);
  state.zoom = Math.min(1.25, Math.max(0.42, z));
  state.panX = -((x0 + x1) / 2) * state.zoom;
  const midY = (y0 + y1) / 2;
  state.panY = -Math.max(y0 + H / (2 * state.zoom) - 40,
                         Math.min(midY, y1 - H / (2 * state.zoom) + 40)) * state.zoom;
}

function renderGraph(){
  const svg = document.getElementById('svg');
  if (pendingFit && svg.clientWidth){ fitView(); pendingFit = false; }
  const zoom = document.getElementById('zoom');
  const vis = visIds();
  const parts = [];
  parts.push('<rect x="-6000" y="-6000" width="12000" height="12000" fill="#fff"/>');
  DATA.edges.forEach(e => {
    const a = N[e.s], b = N[e.t]; if (!a || !b) return;
    const on = vis.has(e.s) && vis.has(e.t);
    const sel = state.sel && (e.s === state.sel || e.t === state.sel);
    const c = sel ? '#000' : (on ? '#999' : '#e5e5e5');
    const w = sel ? 1.6 : 1;
    const x1 = a.x, y1 = a.y, x2 = b.x, y2 = b.y;
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    parts.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}"/>`);
    const cnt = DATA.edges.filter(z => (z.s === e.s && z.t === e.t) ||
                                       (z.s === e.t && z.t === e.s)).length;
    if (cnt > 1 && on)
      parts.push(`<text x="${mx}" y="${my}" font-size="9" fill="#555" text-anchor="middle">${cnt}</text>`);
  });
  const compact = state.zoom < 0.62;    // zoomed out: drop the metadata, keep the identity
  DATA.nodes.forEach(n => {
    const b = N[n.id]; if (!b) return;
    const on = vis.has(n.id);
    const sel = state.sel === n.id;
    const x = b.x - b.w / 2, y = b.y - b.h / 2;
    const fill = sel ? '#000' : '#fff';
    const ink = sel ? '#fff' : (on ? '#000' : '#999');
    parts.push(`<g class="node" data-id="${n.id}" transform="translate(${x},${y})" opacity="${on?1:.22}" style="cursor:pointer">`);
    const tl = titleLines(n);
    const h = compact ? (16 + tl.length * 12 + 8) : b.h;
    parts.push(`<rect width="${b.w}" height="${h}" fill="${fill}" stroke="${ink}" stroke-width="1.4"/>`);
    let ty = 13;
    tl.forEach(ln => {
      parts.push(`<text x="${PAD}" y="${ty}" font-size="11" font-weight="700" fill="${ink}">${esc(ln)}</text>`);
      ty += 12;
    });
    if (!compact){
      parts.push(`<line x1="0" y1="${ty - 6}" x2="${b.w}" y2="${ty - 6}" stroke="${ink}" stroke-width="1"/>`);
      lines(n).forEach(ln => {
        parts.push(`<text x="${PAD}" y="${ty + 4}" font-size="9" fill="${sel?'#fff':'#333'}" letter-spacing=".06em">${esc(short(ln,30))}</text>`);
        ty += LH;
      });
    }
    parts.push('</g>');
  });
  svg.innerHTML = `<g id="zoom" transform="translate(${state.panX + svg.clientWidth/2},${state.panY + svg.clientHeight/2}) scale(${state.zoom})">${parts.join('')}</g>`;
  [...svg.querySelectorAll('.node')].forEach(g => {
    g.addEventListener('mousedown', ev => { ev.stopPropagation(); dragNode = g.dataset.id; });
    g.addEventListener('click', ev => { ev.stopPropagation(); select(g.dataset.id); });
  });
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* graph interaction */
let dragNode = null, panning = false, lastX = 0, lastY = 0;
const svgEl = document.getElementById('svg');
svgEl.addEventListener('mousedown', e => {
  panning = true; lastX = e.clientX; lastY = e.clientY; svgEl.classList.add('drag');
});
window.addEventListener('mousemove', e => {
  if (dragNode){
    const b = N[dragNode];
    b.x += (e.clientX - lastX) / state.zoom; b.y += (e.clientY - lastY) / state.zoom;
    lastX = e.clientX; lastY = e.clientY; renderGraph(); return;
  }
  if (!panning) return;
  state.panX += e.clientX - lastX; state.panY += e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY; renderGraph();
});
window.addEventListener('mouseup', () => {
  dragNode = null; panning = false; svgEl.classList.remove('drag');
});
svgEl.addEventListener('wheel', e => {
  e.preventDefault();
  const k = e.deltaY < 0 ? 1.12 : 1 / 1.12;
  state.zoom = Math.min(2.6, Math.max(0.28, state.zoom * k));
  renderGraph();
}, {passive: false});

/* ---------- matrix ---------- */
function renderMatrix(){
  const rows = DATA.nodes.filter(n => n.type === 'entity' && visible(n));
  const cols = DATA.nodes.filter(n => ['concept','comparison','query'].includes(n.type) && visible(n));
  const inp = [];
  inp.push('<table><thead><tr><th>source</th>');
  cols.forEach(c => inp.push(`<th class="n" title="${esc(c.title)}">${esc(c.id)}</th>`));
  inp.push('<th class="n">Σ</th></tr></thead><tbody>');
  rows.forEach(r => {
    const map = {};
    DATA.edges.filter(e => e.s === r.id).forEach(e => {
      map[e.t] = (map[e.t] || 0) + 1;
    });
    inp.push(`<tr data-id="${r.id}"${state.sel===r.id?' class="sel"':''}><td><a href="#" data-go="${r.id}">${esc(short(r.title, 54))}</a></td>`);
    let sum = 0;
    cols.forEach(c => {
      const v = map[c.id] || 0; sum += v;
      inp.push(`<td class="n">${v ? `<span class="cell f" title="${esc(r.id)} → ${esc(c.id)}"></span>` : '<span class="cell"></span>'}</td>`);
    });
    inp.push(`<td class="n">${sum}</td></tr>`);
  });
  inp.push('</tbody></table>');
  const el = document.getElementById('matrix');
  el.innerHTML = inp.join('');
  el.onclick = e => { const a = e.target.closest('a'); if (a){ e.preventDefault(); select(a.dataset.go); } };
}

/* ---------- index ---------- */
function renderIndex(){
  const rows = DATA.nodes.filter(visible)
    .sort((a,b) => a.rank - b.rank || a.id.localeCompare(b.id));
  const inp = ['<table><thead><tr><th>page</th><th>type</th><th>kind</th>',
    '<th>tags</th><th>conf</th><th class="n">out</th><th class="n">in</th>',
    '<th class="n">quot</th><th>created</th><th>updated</th></tr></thead><tbody>'];
  rows.forEach(n => inp.push(`<tr${state.sel===n.id?' class="sel"':''}>
    <td><a href="#" data-go="${n.id}">${esc(n.title)}</a></td>
    <td>${esc(n.type)}</td><td>${esc(n.kind)}</td>
    <td>${(n.tags||[]).map(t => esc(t)).join(' ')}</td>
    <td>${esc(n.confidence)}${n.contested ? ' !' : ''}</td>
    <td class="n">${n.out.length}</td><td class="n">${n.in.length}</td>
    <td class="n">${(n.quotes||[]).length}</td>
    <td>${esc(n.created)}</td><td>${esc(n.updated)}</td></tr>`));
  inp.push('</tbody></table>');
  const el = document.getElementById('index');
  el.innerHTML = inp.join('');
  el.onclick = e => { const a = e.target.closest('a'); if (a){ e.preventDefault(); select(a.dataset.go); } };
}

/* ---------- panel ---------- */
function select(id){
  state.sel = id;
  const n = byId[id]; if (!n) return;
  const outLi = n.out.map(l => {
    const t = byId[l.t];
    return `<li><a href="#" data-go="${l.t}">${esc(t ? t.title : l.t)}</a>
      <span class="lbl">${esc(l.section || 'body')}${l.refs ? ' · ' + esc(l.refs) : ''}</span></li>`;
  }).join('') || '<li class="empty">none</li>';
  const inLi = n.in.map(sid => {
    const t = byId[sid];
    return `<li><a href="#" data-go="${sid}">${esc(t ? t.title : sid)}</a></li>`;
  }).join('') || '<li class="empty">none</li>';
  const qs = (n.quotes || []).map(q =>
    `<blockquote>“${esc(q[0])}”<cite>— ${esc(q[1])}</cite></blockquote>`).join('')
    || '<div class="empty">no quotes captured on this page</div>';
  document.getElementById('panel').innerHTML = `
    <h2>${esc(n.title)}</h2>
    <dl class="meta">
      <dt>type</dt><dd>${esc(n.type)}${n.kind ? ' · ' + esc(n.kind) : ''}</dd>
      <dt>tags</dt><dd>${(n.tags||[]).map(t => `<span class="chip">${esc(t)}</span>`).join('') || '—'}</dd>
      <dt>confidence</dt><dd>${esc(n.confidence || '—')}${n.contested ? ' · contested' : ''}</dd>
      <dt>created</dt><dd>${esc(n.created || '—')}</dd>
      <dt>updated</dt><dd>${esc(n.updated || '—')}</dd>
      <dt>size</dt><dd>${n.words} words · ${n.out.length} out · ${n.in.length} in</dd>
      <dt>file</dt><dd><span class="lbl">wiki/${esc(n.path)}</span></dd>
    </dl>
    ${n.body_head ? `<div>${esc(n.body_head)}…</div>` : ''}
    <h3>links out</h3><ul>${outLi}</ul>
    <h3>links in</h3><ul>${inLi}</ul>
    <h3>quotes on this page</h3>${qs}`;
  document.getElementById('panel').onclick = e => {
    const a = e.target.closest('a'); if (!a) return;
    e.preventDefault(); select(a.dataset.go);
  };
  render();
}

/* ---------- render ---------- */
function render(){
  headStat();
  if (state.view === 'graph') renderGraph();
  if (state.view === 'matrix') renderMatrix();
  if (state.view === 'index') renderIndex();
}

buildTypes(); buildTags(); buildGrowth(); buildRecent();
render();
window.hermes && (window.__mapData = DATA);
</script>
