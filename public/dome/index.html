<title>Dome — Tara Rose Morris</title>
<style>
:root{--ink:#000;--paper:#fff;--hair:#d4d4d4;--mid:#5c5c5c}
*{border-radius:0!important;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.wrap{max-width:820px;margin:0 auto;padding:0 22px 70px}
header{padding:15px 0 11px;border-bottom:1px solid var(--ink);color:var(--mid);
  font-size:11px;letter-spacing:.10em;text-transform:uppercase;display:flex;flex-wrap:wrap;gap:16px}
header b{color:var(--ink);font-weight:400}
.menu{margin:28px 0 0}
.item{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 18px;
  padding:15px 3px 13px;border-bottom:1px solid var(--hair);
  text-decoration:none;color:var(--ink)}
.item .nm{font-size:15px;letter-spacing:.16em;text-transform:uppercase}
.item .det{margin-left:auto;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--mid);opacity:0;transition:opacity .1s}
a.item:hover .nm,a.item:focus-visible .nm{background:var(--ink);color:var(--paper)}
a.item:hover .det,a.item:focus-visible .det{opacity:1}
.item.off{color:var(--mid);cursor:default}
.item.off:hover .det{opacity:1}
footer{padding-top:13px;color:var(--mid);font-size:10.5px;letter-spacing:.06em;
  text-transform:uppercase;display:flex;flex-wrap:wrap;gap:18px}
@media print{.det{opacity:1}}
@media (hover:none){.det{opacity:1}}
</style>
</head>
